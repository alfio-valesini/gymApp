<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina">
<meta name="theme-color" content="#ECE9E1">
<title>Rutina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECE9E1;
    --paper:#FFFFFF;
    --line:#D8D3C6;
    --ink:#1C1B17;
    --muted:#8A8477;
    --yellow:#E3B505;
    --yellow-deep:#A57C04;
    --green:#33553A;
    --green-pale:#E3ECE1;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  .app{
    max-width:520px;
    margin:0 auto;
    padding:calc(20px + env(safe-area-inset-top)) 16px 0 16px;
  }

  /* header */
  .app-header{
    position:sticky;
    top:0;
    background:var(--bg);
    padding-top:calc(4px + env(safe-area-inset-top));
    padding-bottom:14px;
    z-index:5;
  }
  .header-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .header-top h1{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:0.5px;
    margin:0;
  }
  .ghost-btn{
    background:none;
    border:1.5px solid var(--line);
    color:var(--muted);
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:17px;
    line-height:1;
    cursor:pointer;
  }
  .ghost-btn:active{ background:var(--line); }

  .week-tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:14px;
  }
  .week-tabs button{
    font-family:'Oswald', sans-serif;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.3px;
    padding:9px 0;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  .week-tabs button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--yellow);
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--line);
    border-radius:5px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--green);
    border-radius:5px;
    transition:width .35s ease;
  }
  #progressLabel{
    font-family:'Oswald', sans-serif;
    font-size:14px;
    color:var(--muted);
    min-width:38px;
    text-align:right;
  }

  /* cards */
  main{ padding:6px 0 24px 0; }

  .card{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    transition:background .25s ease, border-color .25s ease;
  }
  .card.done{
    background:var(--green-pale);
    border-color:var(--green);
  }
  .card-main{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 14px;
  }
  .order{
    font-family:'Oswald', sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    background:var(--bg);
    border-radius:50%;
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-top:2px;
  }
  .card.done .order{ background:var(--green); color:#fff; }

  .card-body{ flex:1; min-width:0; }
  .ex-name{
    font-family:'Oswald', sans-serif;
    font-size:18px;
    font-weight:500;
    margin:0 0 4px 0;
    line-height:1.25;
  }
  .ex-metric{ margin-bottom:5px; }
  .metric-num{
    font-family:'Oswald', sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--yellow-deep);
    display:inline-block;
  }
  .metric-suffix{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    margin-left:6px;
  }
  .ex-note{
    font-size:13.5px;
    color:var(--muted);
    margin:2px 0 0 0;
    line-height:1.4;
  }

  .card-actions{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .video-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:14px;
    border:1.5px solid var(--line);
  }
  .video-btn:active{ background:var(--line); }

  .check-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    border:2px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    position:relative;
  }
  .check-btn::after{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width:12px; height:7px;
    border-left:2.5px solid transparent;
    border-bottom:2.5px solid transparent;
    transform:translate(-50%,-60%) rotate(-45deg);
  }
  .card.done .check-btn{ background:var(--green); border-color:var(--green); }
  .card.done .check-btn::after{ border-color:#fff; }

  /* optional cardio cards */
  .optional-card{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:transparent;
  }
  .optional-card .opt-left{ display:flex; flex-direction:column; }
  .optional-card .opt-name{
    font-family:'Oswald', sans-serif;
    font-size:15px;
    font-weight:500;
  }
  .optional-card .opt-sub{
    font-size:12.5px;
    color:var(--muted);
    margin-top:1px;
  }
  .optional-card .opt-tag{
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px 9px;
    flex-shrink:0;
  }

  .tip{
    background:#FBF3D4;
    border:1.5px solid var(--yellow);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:12px;
    font-size:13px;
    line-height:1.45;
    color:var(--ink);
  }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:48px 16px;
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
  }

  footer{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    padding:10px 0 4px 0;
  }
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="header-top">
      <h1 id="title">Día 1</h1>
      <button id="resetBtn" class="ghost-btn" title="Reiniciar sesión">↺</button>
    </div>
    <div class="week-tabs" id="dayTabs"></div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressLabel">0/0</span>
    </div>
  </header>

  <main id="cardList"></main>

  <footer>Toca el círculo para marcar completado · toca ▶ para ver el video</footer>
</div>

<script>
const STORAGE_KEY = 'gym-rutina-state-v2';
const OLD_STORAGE_KEY = 'gym-session1-state';

const days = [
  {
    id:'d1',
    label:'Día 1',
    warmup:{ name:'Cardio progresivo', sub:'Entrada en calor · 5 min' },
    cooldown:{ name:'Cardio suave', sub:'Vuelta a la calma · 5 min' },
    exercises:[
      { id:'ex1', name:'Rueda abdominal', metric:'3 × 8',
        note:'Encorvado en gato enojado y rodillas en colchoneta',
        video:'https://youtube.com/shorts/knjliGWvGa4?si=MsYwKC__q6xWPcJr' },
      { id:'ex2', name:'Movilidad de aductores tipo rana', metric:'2 × 12',
        note:'Movilidad dinámica',
        video:'https://youtube.com/shorts/ixHHbN5xbgE?si=NaLMJzVJO4PJrC9b' },
      { id:'ex3', name:'Saltos laterales en búlgara', metric:'3 por lado × 20',
        note:'Piernas bien reactivas',
        video:'https://youtu.be/CSUkXmm1_MU?si=S5TKcXxCNULlXIL1' },
      { id:'ex4', name:'Sentadilla en multipower con pausa abajo', metric:'3 × 6',
        note:'Subo peso cada semana',
        video:'https://youtube.com/shorts/9hK6721X7s0?si=J4LHuVreio0j4Hb1' },
      { id:'ex5', name:'Subida al cajón con salto', metric:'2 por lado × 15',
        note:'Sin descanso',
        video:'https://youtube.com/shorts/7jJHTwIR2WY?si=iztsPH3DVJkZ0Dsw' },
      { id:'ex6', name:'Press militar unilateral en landmine', metric:'3 por lado × 10',
        note:'Encajo la barra en la chapa negra',
        video:'https://youtu.be/KAUmIt178cw?si=14UNumNW2JLRHzr1' },
      { id:'ex7', name:'Dominadas isométricas arriba', metric:'2', suffix:'series · Al máximo',
        note:'Controlo el movimiento arriba',
        video:'https://youtube.com/shorts/FyHZI9BR2Wk?si=Hi3qxFiGoViLYqer' },
      { id:'ex8', name:'Press banca en suelo lanzando pelota de peso', metric:'3 × 10',
        note:'Pesada',
        video:'https://youtu.be/61IARJecYrs?si=Tov1YQ0NCFu0k2NB' },
      { id:'ex9', name:'Vuelo lateral con mancuernas', metric:'2 × 15',
        note:'Controlo el movimiento',
        video:'https://youtube.com/shorts/wPkosHeBUGc?si=YYu1DWxct3jl3YXr' },
    ]
  },
  {
    id:'d2',
    label:'Día 2',
    warmup:{ name:'Cardio progresivo', sub:'Entrada en calor · 5 min' },
    cooldown:{ name:'Cardio suave', sub:'Vuelta a la calma · 5 min' },
    exercises:[
      { id:'b1', name:'Elevación de piernas en banco de paralelas (piso de arriba)', metric:'3 × 10',
        note:'Busco acercar cadera a costillas',
        video:'https://youtube.com/shorts/lNAuOM4caHI?si=WpxIZigv7tng7Tb_' },
      { id:'b2', name:'Activación de escápulas: vuelo posterior acostado en suelo', metric:'2 × 20',
        note:'Marco y controlo',
        video:'https://youtube.com/shorts/IWO2kEajmHY?si=fD_-c3pL4FsU1eTW' },
      { id:'b3', name:'Remo con barra libre con agarre supino', metric:'3 × 8',
        note:'Subo peso cada semana',
        video:'https://youtube.com/shorts/-rdNQ60JVxE?si=anJvWFbiqTwu0KD7' },
      { id:'b4', name:'Flexiones de brazos sobre cajón con despegue', metric:'3 × 6',
        note:'Recorrido completo y me elevo',
        video:'https://youtube.com/shorts/NS4v3e5ljnQ?si=nGBWHYmh9Fs0mP0_' },
      { id:'b5', name:'Fondos para tríceps en cajón', metric:'60 × 1',
        note:'Uso menor descanso posible',
        video:'https://youtube.com/shorts/xq69GsibaLE?si=OqbTJCTWPnZxhXEt' },
      { id:'b6', name:'Puente de glúteo unilateral', metric:'3 por lado × 12',
        note:'Sin descanso',
        video:'https://youtube.com/shorts/Xz_e_G48S3I?si=RvKvvqYg6A4bV5iz' },
      { id:'b7', name:'Prensa', metric:'3 × 6',
        note:'Profunda y pesada',
        video:'https://youtube.com/shorts/0-t5LejEP1c?si=nNkK9Bb7k_IsitAF' },
      { id:'b8', name:'Saltos laterales', metric:'3 × 12',
        note:'Salto lo más lejos posible',
        video:'https://youtube.com/shorts/jBRBA6jacXg?si=cAXKqNkULtIpfOV1' },
      { id:'b9', name:'Gemelos en sentadilla isométrica', metric:'2 × 30',
        note:'Descanso breve',
        video:'https://youtube.com/shorts/nmCTAwD9k74?si=6xgbFa5UPxxfaLt-' },
    ]
  },
  {
    id:'pub',
    label:'Pubalgia',
    tip:'Rehabilitación pubalgia izquierda. Trabajá con dolor máximo 3/10 y que no aumente al día siguiente. Si molesta, bajá la intensidad o frená. Sin saltos, sprints ni patadas hasta que lo autorice tu kinesiólogo.',
    warmup:{ name:'Bicicleta o caminata suave', sub:'Entrada en calor · 5 min' },
    cooldown:{ name:'Caminata suave', sub:'Vuelta a la calma · 5 min' },
    exercises:[
      { id:'p1', name:'Puente de glúteo con pelota entre rodillas', metric:'3 × 12',
        note:'Aprieto la pelota suave, subo la cadera y bajo lento',
        video:'https://www.youtube.com/shorts/7eWX1Guv4Ns' },
      { id:'p2', name:'Isométrico de aductores con pelota (acostado)', metric:'3 × 30 s',
        note:'Aprieto al 50-70% del máximo, sin dolor mayor a 3/10',
        video:'https://www.youtube.com/watch?v=T-Ben-ppf6w' },
      { id:'p3', name:'Dead bug', metric:'3 por lado × 8',
        note:'Zona lumbar pegada al suelo y abdomen activo',
        video:'https://www.youtube.com/shorts/ZfZnirOwTcU' },
      { id:'p4', name:'Bird dog', metric:'2 por lado × 10',
        note:'Pelvis estable, sin rotar la cadera',
        video:'https://www.youtube.com/shorts/BAqsW014YAI' },
      { id:'p5', name:'Almeja con banda (clamshell)', metric:'3 por lado × 15',
        note:'Activo glúteo medio sin mover la pelvis',
        video:'https://www.youtube.com/shorts/Hj-2r7OlXuE' },
      { id:'p6', name:'Plancha lateral con rodilla apoyada', metric:'3 por lado × 20 s',
        note:'Cadera arriba y alineada, cuerpo recto',
        video:'https://www.youtube.com/shorts/GY9I6ZEwS04' },
      { id:'p7', name:'Copenhagen corto (palanca corta con rodilla)', metric:'3 por lado × 15 s',
        note:'Progresión de aductores, subo de a poco y sin dolor',
        video:'https://www.youtube.com/results?search_query=copenhagen+plank+palanca+corta+rodilla+aductores' },
      { id:'p8', name:'Sentadilla isométrica en pared con pelota entre rodillas', metric:'3 × 30 s',
        note:'Rodillas alineadas, aprieto suave la pelota',
        video:'https://www.youtube.com/shorts/Rwap0_j5i5A' },
      { id:'p9', name:'Estiramiento suave de flexores de cadera', metric:'2 por lado × 30 s',
        note:'Suave y sin forzar, no estiro aductores si duelen',
        video:'https://www.youtube.com/shorts/hwa6fkmdOUs' },
    ]
  }
];

let state = { day:'d1', completed:{ d1:[], d2:[], pub:[] } };

function currentDay(){ return days.find(d=>d.id===state.day) || days[0]; }

/* storage: window.storage if available, localStorage as fallback */
async function storageGet(key){
  try{
    if(window.storage){
      const res = await window.storage.get(key, false);
      return res && res.value ? res.value : null;
    }
  }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage){ await window.storage.set(key, value, false); return; }
  }catch(e){ console.error('No se pudo guardar', e); }
  try{ localStorage.setItem(key, value); }catch(e){}
}

async function loadState(){
  try{
    const raw = await storageGet(STORAGE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p.day && days.some(d=>d.id===p.day)) state.day = p.day;
      if(p.completed) state.completed = Object.assign({d1:[],d2:[],pub:[]}, p.completed);
      return;
    }
    // migrar progreso de la versión anterior (Sesión 1 → Día 1)
    const old = await storageGet(OLD_STORAGE_KEY);
    if(old){
      const p = JSON.parse(old);
      if(Array.isArray(p.completed)) state.completed.d1 = p.completed;
    }
  }catch(e){ /* sin estado previo */ }
}

function saveState(){
  storageSet(STORAGE_KEY, JSON.stringify(state));
}

function cardHTML(ex, order){
  const done = state.completed[state.day].includes(ex.id);
  const suffix = ex.suffix ? `<span class="metric-suffix">${ex.suffix}</span>` : '';
  return `
  <div class="card ${done ? 'done':''}" data-id="${ex.id}">
    <div class="card-main">
      <span class="order">${order}</span>
      <div class="card-body">
        <h2 class="ex-name">${ex.name}</h2>
        <div class="ex-metric"><span class="metric-num">${ex.metric}</span>${suffix}</div>
        <p class="ex-note">${ex.note}</p>
      </div>
      <div class="card-actions">
        <a class="video-btn" href="${ex.video}" target="_blank" rel="noopener">▶</a>
        <button class="check-btn" aria-label="Marcar completado"></button>
      </div>
    </div>
  </div>`;
}

function optionalHTML(item){
  return `
  <div class="optional-card">
    <div class="opt-left">
      <span class="opt-name">${item.name}</span>
      <span class="opt-sub">${item.sub}</span>
    </div>
    <span class="opt-tag">Opcional</span>
  </div>`;
}

function renderList(){
  const day = currentDay();
  const list = document.getElementById('cardList');

  if(day.exercises.length === 0){
    list.innerHTML = `<div class="empty">Todavía no hay ejercicios en esta sección.</div>`;
    return;
  }

  let html = day.tip ? `<div class="tip">${day.tip}</div>` : '';
  html += day.warmup ? optionalHTML(day.warmup) : '';
  day.exercises.forEach((ex,i)=>{ html += cardHTML(ex, i+1); });
  html += day.cooldown ? optionalHTML(day.cooldown) : '';
  list.innerHTML = html;

  list.querySelectorAll('.check-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const card = btn.closest('.card');
      toggleComplete(card.getAttribute('data-id'), card);
    });
  });
}

function toggleComplete(id, card){
  const arr = state.completed[state.day];
  const idx = arr.indexOf(id);
  if(idx === -1){ arr.push(id); card.classList.add('done'); }
  else{ arr.splice(idx,1); card.classList.remove('done'); }
  updateProgress();
  saveState();
}

function updateProgress(){
  const total = currentDay().exercises.length;
  const done = state.completed[state.day].length;
  document.getElementById('progressFill').style.width = (total ? done/total*100 : 0) + '%';
  document.getElementById('progressLabel').textContent = `${done}/${total}`;
}

function renderTabs(){
  document.getElementById('dayTabs').innerHTML = days.map(d =>
    `<button data-day="${d.id}" class="${d.id===state.day ? 'active':''}">${d.label}</button>`
  ).join('');
  document.getElementById('title').textContent = currentDay().label;
}

document.getElementById('dayTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  state.day = btn.dataset.day;
  renderTabs();
  renderList();
  updateProgress();
  saveState();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('¿Reiniciar los checks de esta sesión?')){
    state.completed[state.day] = [];
    renderList();
    updateProgress();
    saveState();
  }
});

(async function init(){
  await loadState();
  renderTabs();
  renderList();
  updateProgress();
})();
</script>
</body>
</html>
